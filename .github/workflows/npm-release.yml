name: NPM Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/do-again
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify release versions
        run: python tools/check_release_version.py --tag "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm publish
      - name: Wait for npm registry availability
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 120); do
            published=$(npm view "do-again@$version" version 2>/dev/null || true)
            latest=$(npm view do-again dist-tags.latest 2>/dev/null || true)
            if [ "$published" = "$version" ] && [ "$latest" = "$version" ]; then
              echo "do-again@$version is available from the public npm registry"
              exit 0
            fi
            echo "Waiting for npm registry propagation ($attempt/120)..."
            sleep 15
          done
          echo "Timed out waiting for do-again@$version to become publicly available" >&2
          exit 1
