[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "do-again"
version = "1.0.0"
description = "Policy-controlled local execution for agent-driven development workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Steven Tran"}]
keywords = ["agents", "automation", "developer-tools", "github", "orchestration", "local-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Tran-Steven/do-again"
Repository = "https://github.com/Tran-Steven/do-again"
Issues = "https://github.com/Tran-Steven/do-again/issues"

[project.scripts]
do-again = "do_again.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/do_again"]
